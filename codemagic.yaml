workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      groups:
        - codemagic_android
      vars:
        PACKAGE_NAME: "com.sealmaster.billing"
        GEMINI_API_KEY: $GEMINI_API_KEY
      node: 18
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

